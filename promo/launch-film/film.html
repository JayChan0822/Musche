<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musche — Your music. Your time.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#e8e6e0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9;box-shadow:0 10px 90px #24242322}#transport{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:#fffffff0;padding:12px 18px;border:1px solid #ddd;border-radius:18px;opacity:0;transition:opacity .25s}body:hover #transport{opacity:1}button{border:0;background:#262623;color:white;border-radius:9px;padding:9px 16px;cursor:pointer}input{width:300px}span{font-size:12px;color:#666}
</style>
<canvas id="film" width="1920" height="1080"></canvas>
<div id="transport"><button id="play">Play</button><input id="seek" type="range" min="0" max="48" step=".01" value="0"><span id="time">0:00 / 0:48</span></div>
<audio id="music" src="audio/musche-score-master.wav" preload="auto"></audio>
<script src="film.js"></script>
</html>
